url: "https://oterium.github.io/aforoR"

template:
  bslib:
    version: 5
    bootswatch: lumen
    primary: "blue"
    secondary: "red"
    bg: "white"
    fg: "black"
    base_font: "Arial"
    code_font: "Fira Code"
    pkgdown-nav-height: 80px
    pkgdown-sidebar-width: 250px
  css: "extra.css"

navbar:
  structure:
    left: [intro, reference, classic, experimental, bibliography]
    right: [github, search]
  components:
    intro:
      text: "aforoR"
      href: index.html
    reference:
      text: "Functions"
      href: reference/index.html
    classic:
      text: "AFORO Classic"
      menu:
        - text: "Getting Started"
        - text: "Comparing Shape Descriptors"
          href: articles/Shape_Descriptors.html
        - text: "Image Preprocessing & Contour Extraction"
          href: articles/Obtaining_Contour.html
        - text: "Basic Morphometry & Shape Indices"
          href: articles/Otolith_Morphometry.html
        - text: "Wavelet Theory & Fundamentals"
          href: articles/Knowing_Wavelets.html
        - text: "Population Discrimination with Wavelets"
          href: articles/Working_Wavelets.html
    experimental:
      text: "AFORO Experimental"
      menu:
        - text: "Advanced Topics"
        - text: "Detecting Shape Phenotypes"
          href: articles/Phenotypes.html
        - text: "Lobe Analysis with CSS"
          href: articles/Analyzing_Lobes.html
        - text: "Optimal Point Selection (Hall & Bathia)"
          href: articles/Point_Selection.html
    bibliography:
      text: "Bibliography"
      href: articles/References.html
    points:
      text: "Point Selection"
      href: reference/select_points_hall.html

articles:
  - title: "AFORO Classic"
    desc: "Original AFORO Methodology"
    contents:
      - Shape_Descriptors
      - Obtaining_Contour
      - Otolith_Morphometry
      - Knowing_Wavelets
      - Working_Wavelets

  - title: "AFORO Experimental"
    desc: "New morphological features and measurements"
    contents:
      - Phenotypes
      - Analyzing_Lobes
      - Point_Selection

  - title: "References"
    contents:
      - References

reference:
  - title: "Main Workflow"
    desc: "Functions for the complete analysis pipeline"
    contents:
      - process_images

  - title: "Image Processing"
    desc: "Functions for image manipulation and contour extraction"
    contents:
      - preprocess_image
      - extract_contour

  - title: "Shape Analysis"
    desc: "Functions for calculating shape descriptors"
    contents:
      - calculate_distances
      - calculate_morphometrics
      - calculate_wavelets_analysis
      - calculate_css
      - fwaveletspl_3
      - plot.css

  - title: "Analysis & Selection"
    desc: "Advanced analysis and point selection"
    contents:
      - select_points_hall

  - title: "Visualization & Export"
    desc: "Functions for saving results and images"
    contents:
      - save_visualization
      - save_visualization_perimeter
      - save_analysis_results
      - create_result_structure

  - title: "Datasets"
    desc: "Built-in datasets for example and testing"
    contents:
      - Aphanopus
      - Aphanopus_EF
      - Aphanopus_W5

  - title: "Internal Helpers"
    desc: "Low-level functions used by the main analysis pipeline"
    contents:
      - ild
      - fatrous1d
      - regularradius
      - dper

code:
  width: 50
